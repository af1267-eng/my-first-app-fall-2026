<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Web App</title>
</head>
<body>

  <!-- SITE NAVIGATION -->
  <div class="container">
    <nav>
      <h1><a href="/">My Web App</a></h1>
      <ul>
        <li><a href="/about">About</a></li>
        <li><a href="/hello">Hello</a></li>
        <li><a href="/rps/form">RPS Game</a></li>
        <li><a href="/stocks/form">Stocks</a></li>
      </ul>
    </nav>
    <hr>

    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
          {% for message in messages %}
            <li><strong>{{ message }}</strong></li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <!-- PAGE CONTENTS -->
    <div id="content">
      {% block content %}
      {% endblock %}
    </div>

    <!-- FOOTER -->
    <footer>
      <hr>
      <p>
        &copy; Copyright 2025 Your Name Here |
        <a href="https://github.com/prof-rossetti/intro-to-python">Source</a>
      </p>
    </footer>
  </div>

</body>
</html>
